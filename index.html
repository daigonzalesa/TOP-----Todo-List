<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <script src="https://kit.fontawesome.com/81af46130b.js" crossorigin="anonymous"></script>
<script defer src="main.js"></script></head>
<body>
    <main>
        <div id="project-panel">

            <h1>My ToDo List</h1>

            <button id="project-btn">
                 <i class="fa-solid fa-plus"></i>
                Add Project
            </button>

            <div id="projects-view"></div>

            <dialog id="project-modal">
            <form id="project-form" method="dialog">
                <h2>New Project</h2>
                <input type="text" id="project-name" placeholder="eg. Chores" required>
                <div class="modal-buttons">
                    <button type="submit" id="submit-project-btn" class="submit-btn">Create Project</button>
                    <button type="button" class="close-btn">Cancel</button>
                </div>
            </form>
            </dialog>

        </div>

        <div id="task-panel">

            <div id="task-controls">

                <button id="date-btn">
                    <i class="fa-regular fa-calendar-days"></i>
                    Sort by Date
                </button>

                <button id="priority-btn">
                    <i class="fa-solid fa-arrow-up-wide-short"></i>
                    Sort by Priority
                </button>

                <button id="clear-btn">
                    <i class="fa-solid fa-check-double"></i>
                    Delete Completed 
                </button>
            
                <button id="task-btn">
                     <i class="fa-solid fa-plus"></i>
                    Add Task
                </button>
            </div>
            
            <h2 id="current-project-title"></h2>
            
            <div id="task-manager">
            </div>

             


            <dialog id="task-modal">
            <form id="task-form" method="dialog">
                <h2>New Task</h2>

                <div class="form-group">
                    <label for="task-name">Task:</label>
                    <input type="text" id="task-name" name="Task" placeholder="eg. Do groceries" required>
                </div>

                <div class="form-group">
                    <label for="task-description">Notes:</label>
                    <input type="text" id="task-description" name="Notes" placeholder="eg. Follow shopping list">
                </div>

                <div class="form-group">
                    <label for="date">Due Date:</label>
                    <input type="date" id="date" name="due-date" required>
                </div>

                <div class="form-group">
                    <label for="priority">Priority:</label>
                    <select id="priority" name="task-priority">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    
                </div>

                <div class="modal-buttons">
                    <button type="submit" id="submit-task-btn" class="submit-btn">Create Task</button>
                    <button type="button" class="close-btn">Cancel</button>
                </div>
            </form>
            </dialog>

        </div>
    </main>

</body>
</html>
